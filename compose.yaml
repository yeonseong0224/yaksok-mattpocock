# 로컬 개발용 PostgreSQL (개인 개발 DB 전용 — 운영은 Neon)
services:
  db:
    image: postgres:17
    container_name: yaksok-db
    environment:
      POSTGRES_USER: yaksok
      POSTGRES_PASSWORD: yaksok
      POSTGRES_DB: yaksok
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaksok -d yaksok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
